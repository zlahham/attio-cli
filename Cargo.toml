[package]
name = "attio"
version = "0.3.0"
edition = "2024"
description = "A CLI tool for interacting with the Attio CRM API"
license = "MIT"
repository = "https://github.com/zlahham/attio-cli"
readme = "README.md"

[dependencies]
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.52", features = ["full"] }
dotenvy = "0.15"
comfy-table = "7.1"
dirs = "6.0"
webbrowser = "1.2"
ratatui = "0.30"
crossterm = "0.29"

# Release configuration (cargo-release)
[package.metadata.release]
# Skip crates.io publish — GitHub Actions handles this on tag push
publish = false
# Tag format matching existing convention (v0.2.0, v0.3.0, etc.)
tag-name = "v{{version}}"
# Commit message format
pre-release-commit-message = "Bump version to {{version}}"
# Push to remote after tagging
push = true
tag = true
